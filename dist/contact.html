<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>deGoat's Stew</title>
        <link rel="stylesheet" href="../src/contact-style.css">
    </head>
    <body>
        <script src="main.js"></script>
        <div id="content">
            <div class="header">
                <div class="logo">deGoat's Stew</div>
                <div class="nav-options">
                    <ul>
                        <li><a href="./index.html">Home</a></li>
                        <li><a href="./menu.html">Menu</a></li>
                        <li><a href="./contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
            <div class="form-container">
                <form id="contact-form">
                    <ul>
                        <li>
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="guest_name">
                        </li>
                        <li>
                            <label for="mail">E-mail:</label>
                            <input type="email" id="mail" name="guest_email">
                        </li>
                        <li>
                            <label for="msg">Message:</label>
                            <textarea id="msg" name="user_message" placeholder="Write your message..."></textarea>
                        </li>
                        <li class="button">
                            <button type="submit">Send</button>
                        </li>
                    </ul>
                </form>
            </div>
        </div>
    </body>
</html>
